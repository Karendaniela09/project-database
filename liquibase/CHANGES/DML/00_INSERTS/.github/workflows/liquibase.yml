name: Validar Base de Datos

on:
  push:
    branches:
      - main

jobs:
  liquibase-check:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Verificar estructura
        run: |
          echo "Verificando..."
          ls -R

          echo "Buscando changelog..."
         if [ -f ./liquibase/changelog.yml ]; then
  echo "Changelog encontrado ✅"
else
  echo "ERROR: Falta changelog ❌"
  exit 1
fi 